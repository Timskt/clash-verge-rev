name: Meeting Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to create or update"
        required: true
        default: "meeting-build"
        type: string
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/meeting-build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/**"
      - "scripts/prebuild.mjs"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: "--max_old_space_size=4096"
  RUST_BACKTRACE: short

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows
            path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos
            path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: macos
            path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,rpm
            artifact: linux
            path: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: meeting-${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.0.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare platform resources
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build Meeting bundle
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }} --no-sign --config src-tauri/tauri.ci.conf.json

      - name: Verify main executable name
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) test -f "target/${{ matrix.target }}/release/meeting.exe" ;;
            macOS) test -f "target/${{ matrix.target }}/release/bundle/macos/Meeting.app/Contents/MacOS/meeting" ;;
            Linux) test -f "target/${{ matrix.target }}/release/meeting" ;;
          esac

      - name: Upload ${{ matrix.artifact }} bundle
        uses: actions/upload-artifact@v7
        with:
          name: meeting-${{ matrix.artifact }}-${{ matrix.target }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          archive: false

  publish-release:
    name: Publish Meeting Release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: meeting-*
          path: release-assets
          merge-multiple: true

      - name: Verify release packages
        shell: bash
        run: |
          mapfile -t files < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Meeting installation packages were found."
            exit 1
          fi
          printf 'Release package: %s\n' "${files[@]}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Meeting Build" \
              --notes "Unsigned Meeting installers built from commit $SOURCE_SHA." \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Meeting Build" \
              --notes "Unsigned Meeting installers built from commit $SOURCE_SHA." \
              --prerelease
          fi

          mapfile -t files < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -print)
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
